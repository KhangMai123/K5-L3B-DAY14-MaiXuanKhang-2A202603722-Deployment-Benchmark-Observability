services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AGENT_HOST_PORTS:-8000}:${PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-8000}
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-1.0}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent_net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - agent_net

volumes:
  redis_data:

networks:
  agent_net:
    driver: bridge
