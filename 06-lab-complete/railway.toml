# Railway configuration for 06-lab-complete (Part 6 agent)
# Set Railway Root Directory to 06-lab-complete and configure variables in dashboard/CLI:
#   AGENT_API_KEY, REDIS_URL, ENVIRONMENT=production, RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
